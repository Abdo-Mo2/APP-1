<section class="contact-section d-flex align-items-center justify-content-center">
  <div class="contact-content text-center">
    <h2 class="contact-title mb-4">CONTACT SECTION</h2>
    <div class="contact-divider d-flex align-items-center justify-content-center mb-4">
      <div class="divider-line"></div>
      <span class="divider-icon mx-3">
        <i class="fa-solid fa-star"></i>
      </span>
      <div class="divider-line"></div>
    </div>
    <form class="contact-form mx-auto" style="max-width: 400px;">
      <div class="mb-3 text-start">
        <label for="name" class="form-label text-white">Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your name">
      </div>
      <div class="mb-3 text-start">
        <label for="age" class="form-label text-white">Age</label>
        <input type="number" class="form-control" id="age" placeholder="Enter your age">
      </div>
      <div class="mb-3 text-start">
        <label for="email" class="form-label text-white">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email">
      </div>
      <div class="mb-3 text-start">
        <label for="password" class="form-label text-white">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Send Message</button>
    </form>
  </div>
</section>
